# CI/CD Configuration for GitHub Actions

name: DeepIRI ZepGPU CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Run Ruff
        run: poetry run ruff check deepiri_zepgpu

      - name: Run Black
        run: poetry run black --check deepiri_zepgpu

      - name: Run MyPy
        run: poetry run mypy deepiri_zepgpu

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zepgpu
          POSTGRES_PASSWORD: zepgpu
          POSTGRES_DB: zepgpu_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zepgpu -d zepgpu_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://zepgpu:zepgpu@127.0.0.1:5433/zepgpu_test
      DATABASE__URL: postgresql+asyncpg://zepgpu:zepgpu@127.0.0.1:5433/zepgpu_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Run unit tests
        run: poetry run pytest tests/ -m "not integration and not regression and not revolution" --cov=deepiri_zepgpu --cov-report=xml

      - name: Run integration tests
        run: poetry run pytest tests/integration/ -m integration -v --tb=short --cov=deepiri_zepgpu --cov-append --cov-report=xml

      - name: Run regression tests
        run: poetry run pytest tests/regression/ -m regression -v --tb=short --cov=deepiri_zepgpu --cov-append --cov-report=xml

      - name: Run revolution suite
        run: poetry run pytest tests/adversarial tests/revolution -m revolution -v --tb=short --cov=deepiri_zepgpu --cov-append --cov-report=xml

      - name: Revolution audit artifact
        run: |
          mkdir -p artifacts
          poetry run python - <<'PY'
          import asyncio
          from pathlib import Path
          from deepiri_zepgpu.compute_ledger.revolution import run_revolution_audit
          from deepiri_zepgpu.compute_ledger.revolution.report import write_audit_json, write_audit_markdown
          from deepiri_zepgpu.database.session import get_db_context

          async def main():
              async with get_db_context() as db:
                  result = await run_revolution_audit(db, include_db=True)
              write_audit_json(result, Path("artifacts/revolution-audit.json"))
              write_audit_markdown(result, Path("artifacts/revolution-audit.md"))
              print(result.to_dict()["headline"])
              raise SystemExit(0 if result.passed else 1)

          asyncio.run(main())
          PY

      - name: Upload revolution audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revolution-audit
          path: artifacts/

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'release'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        uses: azure/k8s-deploy@v2
        with:
          namespace: deepiri
          manifests: |
            k8s/deployment.yaml
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          credentials:
            kubeconfig: ${{ secrets.KUBE_CONFIG }}
