# CI/CD Configuration for GitHub Actions

name: DeepIRI ZepGPU CI/CD

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop, "feat/**"]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Run Ruff
        run: poetry run ruff check deepiri_zepgpu

      - name: Run Black
        run: poetry run black --check deepiri_zepgpu

      - name: Run MyPy
        run: poetry run mypy deepiri_zepgpu

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zepgpu
          POSTGRES_PASSWORD: zepgpu
          POSTGRES_DB: zepgpu_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zepgpu -d zepgpu_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://zepgpu:zepgpu@127.0.0.1:5433/zepgpu_test
      DATABASE__URL: postgresql+asyncpg://zepgpu:zepgpu@127.0.0.1:5433/zepgpu_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Run unit tests
        run: poetry run pytest tests/ -m "not integration and not regression and not revolution" --cov=deepiri_zepgpu --cov-report=xml

      - name: Run integration tests
        run: poetry run pytest tests/integration/ -m integration -v --tb=short --cov=deepiri_zepgpu --cov-append --cov-report=xml

      - name: Run regression tests
        run: poetry run pytest tests/regression/ -m regression -v --tb=short --cov=deepiri_zepgpu --cov-append --cov-report=xml

      - name: Run revolution suite
        run: poetry run pytest tests/adversarial tests/revolution -m revolution -v --tb=short --cov=deepiri_zepgpu --cov-append --cov-report=xml

      - name: Revolution audit artifact
        run: poetry run python scripts/run_revolution_audit.py

      - name: Upload revolution audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revolution-audit
          path: artifacts/

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Kubernetes config
        id: kubeconfig
        shell: bash
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KUBE_CONFIG secret is not configured; skipping deploy."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Kubernetes context
        if: steps.kubeconfig.outputs.available == 'true'
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ env.KUBE_CONFIG }}

      - name: Deploy to Kubernetes
        if: steps.kubeconfig.outputs.available == 'true'
        uses: Azure/k8s-deploy@v5
        with:
          namespace: zepgpu
          manifests: |
            k8s/deployment.yaml
